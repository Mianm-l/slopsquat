name: SlopSquat Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SlopSquat
        run: |
          pip install git+https://github.com/Mianm-l/slopsquat.git

      - name: Run SlopSquat Guard
        run: |
          slopsquat . --threshold 80
